<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDUOJ9njsdpIGNM39xVojy_z0f4KeH_X6g",
    authDomain: "fiszki-ea26f.firebaseapp.com",
    projectId: "fiszki-ea26f",
    storageBucket: "fiszki-ea26f.firebasestorage.app",
    messagingSenderId: "552049727665",
    appId: "1:552049727665:web:3cc94be33de561f4422a90"
  };

  const ADMIN_EMAIL = "pawelkorbecki88@gmail.com";

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);

  window.appLoginWithGoogle = async function() {
    const provider = new GoogleAuthProvider();
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      alert("Blad logowania: " + e.message);
    }
  };

  window.appLogout = async function() {
    await signOut(auth);
    window.location.reload();
  };

window.syncProgressToCloud = async function(progressObj, customWordsArr) {
 if (!window.currentUser || window.currentUser.status !== "approved") return;
 try {
 const userRef = doc(db, "users", window.currentUser.uid);
 await setDoc(userRef, { progress: progressObj, customWords: customWordsArr }, { merge: true });
 } catch (e) {
 console.log("Sync error: " + e.message);
 }
};

function mergeProgress(localProgress, cloudProgress) {
 var merged = {};
 var allIds = {};
 for (var id in localProgress) { allIds[id] = true; }
 for (var id2 in cloudProgress) { allIds[id2] = true; }
 for (var id3 in allIds) {
 var local = localProgress[id3];
 var cloud = cloudProgress[id3];
 if (!local) { merged[id3] = cloud; }
 else if (!cloud) { merged[id3] = local; }
 else { merged[id3] = (local.level >= cloud.level) ? local : cloud; }
 }
 return merged;
}

  onAuthStateChanged(auth, async function(user) {
    if (!user) {
      window.currentUser = null;
      if (window.onAuthReady) window.onAuthReady(null);
      return;
    }
    const userRef = doc(db, "users", user.uid);
    const snap = await getDoc(userRef);

   
if (!snap.exists()) {
 const isAdmin = user.email === ADMIN_EMAIL;
 const localProgressRaw = localStorage.getItem("word_trainer_progress_v1");
 const localCustomRaw = localStorage.getItem("word_trainer_custom_words_v1");
 const localProgress = localProgressRaw ? JSON.parse(localProgressRaw) : {};
 const localCustom = localCustomRaw ? JSON.parse(localCustomRaw) : [];
 const newUserData = {
 email: user.email,
 status: isAdmin ? "approved" : "pending",
 isAdmin: isAdmin,
 progress: localProgress,
 customWords: localCustom,
 createdAt: new Date().toISOString()
 };
 await setDoc(userRef, newUserData);
 window.currentUser = { uid: user.uid, ...newUserData };
 } else {
 const cloudData = snap.data();
 if (cloudData.status === "approved") {
 const localProgressRaw = localStorage.getItem("word_trainer_progress_v1");
 const localCustomRaw = localStorage.getItem("word_trainer_custom_words_v1");
 const localProgress = localProgressRaw ? JSON.parse(localProgressRaw) : {};
 const localCustom = localCustomRaw ? JSON.parse(localCustomRaw) : [];
 const cloudProgress = cloudData.progress || {};
 const cloudCustom = cloudData.customWords || [];
 const mergedProgress = mergeProgress(localProgress, cloudProgress);
 const mergedCustomIds = {};
 const mergedCustom = [];
 cloudCustom.concat(localCustom).forEach(function(w) {
 if (!mergedCustomIds[w.id]) { mergedCustomIds[w.id] = true; mergedCustom.push(w); }
 });
 localStorage.setItem("word_trainer_progress_v1", JSON.stringify(mergedProgress));
 localStorage.setItem("word_trainer_custom_words_v1", JSON.stringify(mergedCustom));
 await setDoc(userRef, { progress: mergedProgress, customWords: mergedCustom }, { merge: true });
 cloudData.progress = mergedProgress;
 cloudData.customWords = mergedCustom;
 }
 window.currentUser = { uid: user.uid, ...cloudData };
 }
 if (window.onAuthReady) window.onAuthReady(window.currentUser);
});

</script>

<script>
var STORAGE_KEY = "word_trainer_progress_v1";
var CUSTOM_WORDS_KEY = "word_trainer_custom_words_v1";
var STATS_KEY = "word_trainer_stats_v1";

function loadProgress() {
  var raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : {};
}
function saveProgress(p) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
function loadCustomWords() {
  var raw = localStorage.getItem(CUSTOM_WORDS_KEY);
  return raw ? JSON.parse(raw) : [];
}
function saveCustomWords(list) {
  localStorage.setItem(CUSTOM_WORDS_KEY, JSON.stringify(list));
}
function getAllWords() {
  return WORDS_DATA.concat(loadCustomWords());
}
function loadStats() {
  var raw = localStorage.getItem(STATS_KEY);
  return raw ? JSON.parse(raw) : {};
}
function saveStats(s) {
  localStorage.setItem(STATS_KEY, JSON.stringify(s));
}
function logAnswer(isCorrect) {
  var stats = loadStats();
  var today = new Date().toISOString().slice(0,10);
  if (!stats[today]) { stats[today] = { correct: 0, wrong: 0 }; }
  if (isCorrect) { stats[today].correct++; } else { stats[today].wrong++; }
  saveStats(stats);
}
function getWeekStats() {
  var stats = loadStats();
  var days = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date();
    d.setDate(d.getDate() - i);
    var key = d.toISOString().slice(0,10);
    var dayData = stats[key] || { correct: 0, wrong: 0 };
    days.push({ date: key, correct: dayData.correct, wrong: dayData.wrong });
  }
  return days;
}

var progress = loadProgress();


function getWordState(id) {
 if (!progress[id]) { return { level: 0, nextReview: 0, seen: 0, correct: 0 }; }
 return progress[id];
}


var INTERVAL_DAYS = [0, 1, 3, 7, 14, 30, 90];


function reviewWord(id, wasCorrect) {
 logAnswer(wasCorrect);
 updateLastActivity();

  var state = getWordState(id);
  state.seen += 1;
  if (wasCorrect) {
    state.correct += 1;
    state.level = Math.min(state.level + 1, 6);
  } else {
    state.level = Math.max(state.level - 2, 0);
  }
  var now = Date.now();
  state.nextReview = now + INTERVAL_DAYS[state.level] * 24 * 60 * 60 * 1000;

 progress[id] = state;
 saveProgress(progress);
 if (window.syncProgressToCloud) { window.syncProgressToCloud(progress, loadCustomWords()); }
}


function dueWords() {
  var now = Date.now();
  return getAllWords().filter(function(w) {
    var s = getWordState(w.id);
    return s.nextReview <= now;
  });
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function hardWords() {
  return getAllWords().filter(function(w) {
    var s = getWordState(w.id);
    return s.seen > 0 && (s.seen - s.correct) > 0;
  }).sort(function(a, b) {
    var sa = getWordState(a.id);
    var sb = getWordState(b.id);
    return (sb.seen - sb.correct) - (sa.seen - sa.correct);
  });
}

function masteredCount() {
  return getAllWords().filter(function(w) { return getWordState(w.id).level >= 3; }).length;
}
function inProgressCount() {
  return getAllWords().filter(function(w) { var l = getWordState(w.id).level; return l >= 1 && l <= 2; }).length;
}
function newCount() {
  return getAllWords().filter(function(w) { return getWordState(w.id).level === 0; }).length;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  utter.rate = 0.9;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

function exportProgress() {
  var payload = { progress: progress, customWords: loadCustomWords(), exportedAt: new Date().toISOString() };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "postep-slowka-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importProgress(file, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (data.progress) { progress = data.progress; saveProgress(progress); }
      if (data.customWords) { saveCustomWords(data.customWords); }
      callback(true);
    } catch (err) { callback(false); }
  };
  reader.readAsText(file);
}

var CATEGORY_COLORS = {
  "Finance & KPIs": "#2649B2",
  "Trends & Numbers": "#4A74F3",
  "Sales Channels & Products": "#8E7DE3",
  "Strategy & Negotiations": "#9D5CE6",
  "Operations & Execution": "#B55CE6",
  "Meeting & Pitch Phrases": "#6C8BE0",
  "Client & Stakeholder Management": "#2649B2",
  "Quick Utility Words": "#9D5CE6",
  "Custom": "#666"
};
function categoryTag(cat) {
  var color = CATEGORY_COLORS[cat] || "#666";
  return '<div class="category-tag" style="background:' + color + '22;color:' + color + ';">' + cat + '</div>';
}

var REMINDER_KEY = "word_trainer_reminder_enabled_v1";
var LAST_ACTIVITY_KEY = "word_trainer_last_activity_v1";

function isReminderEnabled() {
  var val = localStorage.getItem(REMINDER_KEY);
  return val === null ? true : val === "true";
}
function setReminderEnabled(enabled) {
  localStorage.setItem(REMINDER_KEY, enabled ? "true" : "false");
}
function updateLastActivity() {
  localStorage.setItem(LAST_ACTIVITY_KEY, new Date().toISOString());
}
function daysSinceLastActivity() {
  var raw = localStorage.getItem(LAST_ACTIVITY_KEY);
  if (!raw) return null;
  var last = new Date(raw);
  var now = new Date();
  var diffMs = now - last;
  return Math.floor(diffMs / (1000 * 60 * 60 * 24));
}
function renderReminderBanner() {
  if (!isReminderEnabled()) return null;
  var days = daysSinceLastActivity();
  if (days === null || days < 1) return null;
  var banner = document.createElement("div");
  banner.className = "card reminder-banner";
  var msg = days === 1 ? "Nie cwiczyles wczoraj. Wroc do nauki!" : "Nie cwiczyles od " + days + " dni. Wroc do nauki!";
  banner.innerHTML = "<p>" + msg + "</p>";
  return banner;
}

function render(view) {
  app.classList.remove("fade-in");
  app.innerHTML = "";
  view();
  void app.offsetWidth;
  app.classList.add("fade-in");
}

function backButton() {

  b.className = "back-btn";
  b.textContent = "Powrot do menu";
  b.onclick = function() { render(renderMenu); };
  return b;
}


var USER_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="4" fill="white"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';

function renderHeaderAuthButton() {
 var area = document.getElementById("headerAuthArea");

 var user = window.currentUser;
 var btn = document.createElement("button");
 btn.className = "header-auth-btn";
 if (!user) {
 btn.innerHTML = USER_ICON_SVG + '<span>Zaloguj</span>';
 btn.onclick = function() { window.appLoginWithGoogle(); };
 } else {
 btn.innerHTML = USER_ICON_SVG + '<span>Wyloguj</span>';
 btn.title = user.email;
 btn.onclick = function() { window.appLogout(); };
 }
 area.innerHTML = "";
 area.appendChild(btn);
}



function renderAuthPanel() {
 var user = window.currentUser;
 if (!user) {
 var card = document.createElement("div");
 card.className = "card";
 card.innerHTML =
 '<p style="font-size:13px;color:#666;margin-top:0;">Mozesz uzywac strony bez logowania - Twoj postep zapisze sie tylko w tej przegladarce. Zaloguj sie przez ikone w prawym gornym rogu, aby zsynchronizowac postep z innymi urzadzeniami.</p>';
 return card;
 }
 if (user.status === "pending") {
 var card2 = document.createElement("div");
 card2.className = "card";
 card2.innerHTML =
 '<p style="font-size:13px;color:#666;margin-top:0;">Zalogowano jako ' + user.email + '</p>' +
 '<p class="feedback bad">Twoje konto oczekuje na zatwierdzenie przez administratora. W miedzyczasie mozesz korzystac ze strony normalnie - Twoj postep zapisuje sie lokalnie.</p>';
 return card2;
 }
 return null;
}





function renderMenu() {
 renderHeaderAuthButton();
 var authPanel = renderAuthPanel();
 if (authPanel) { app.appendChild(authPanel); }


 var total = getAllWords().length;
 var mastered = masteredCount();

  var inProgress = inProgressCount();
  var fresh = newCount();
  var due = dueWords().length;

  var reminderBanner = renderReminderBanner();
  if (reminderBanner) { app.appendChild(reminderBanner); }


  var card = document.createElement("div");
  card.className = "card stat-card";
  card.innerHTML =
    '<div class="stats">' +
      '<div class="stat-item"><span class="stat-num">' + fresh + '</span><span class="stat-label">Nowe</span></div>' +
      '<div class="stat-item"><span class="stat-num">' + inProgress + '</span><span class="stat-label">W trakcie</span></div>' +
      '<div class="stat-item"><span class="stat-num">' + mastered + '/' + total + '</span><span class="stat-label">Opanowane</span></div>' +
    '</div>' +
    '<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:' + Math.round(mastered/total*100) + '%"></div></div>' +
    '<p class="due-text">Do powtorki dzis: ' + due + ' slowek</p>';
  app.appendChild(card);

  var menuCard = document.createElement("div");
  menuCard.className = "card";
  var grid = document.createElement("div");
  grid.className = "menu-grid";
  menuCard.appendChild(grid);
  app.appendChild(menuCard);


  var items = [
    { label: "Sesja dnia", icon: "\ud83c\udf1f", action: startDailySession },
    { label: "Wyzwanie 60 sekund", icon: "\u23f1", action: startChallenge },
    { label: "Fiszki EN -> PL", icon: "\ud83c\udccf", action: function(){ startFlashcards("en"); } },
    { label: "Fiszki PL -> EN", icon: "\ud83c\udccf", action: function(){ startFlashcards("pl"); } },
    { label: "Quiz wielokrotnego wyboru", icon: "\u2753", action: startQuiz },
    { label: "Uzupelnij luke w zdaniu", icon: "\u270f\ufe0f", action: startGapFill },
    { label: "Wpisz slowo z pamieci", icon: "\ud83d\udd24", action: startTyping },
    { label: "Uloz zdanie", icon: "\ud83e\udde9", action: startSentenceBuilder },
    { label: "Dodaj nowe slowo", icon: "\u2795", action: renderAddWord, secondary:true },

function startDailySession() {
  var pool = dueWords().length ? dueWords() : getAllWords();
  var flashSet = shuffle(pool).slice(0, 5);
  var quizSet = shuffle(pool).slice(0, 5);
  var gapSet = shuffle(pool).slice(0, 3);

  var steps = [];
  flashSet.forEach(function(w) { steps.push({ type: "flash", word: w }); });
  quizSet.forEach(function(w) { steps.push({ type: "quiz", word: w }); });
  gapSet.forEach(function(w) { steps.push({ type: "gap", word: w }); });
  steps = shuffle(steps);

  var idx = 0;
  var correctCount = 0;
  var wrongCount = 0;
  var showingAnswer = false;

  function draw() {
    app.innerHTML = "";
    app.appendChild(backButton());
    if (idx >= steps.length) {
      var done = document.createElement("div");
      done.className = "card";
      done.innerHTML = "<h3>Sesja dnia zakonczona</h3><p>Wynik: " + correctCount + " poprawnych, " + wrongCount + " blednych z " + steps.length + " zadan.</p>";
      app.appendChild(done);
      return;
    }
    var scoreCard = document.createElement("div");
    scoreCard.className = "card score-card";
    scoreCard.innerHTML = '<div class="stats"><span>Zadanie ' + (idx+1) + ' / ' + steps.length + '</span><span>Poprawne: ' + correctCount + ' | Bledne: ' + wrongCount + '</span></div>';
    app.appendChild(scoreCard);

    var step = steps[idx];
    var w = step.word;

    if (step.type === "flash") {
      renderFlashStep(w);
    } else if (step.type === "quiz") {
      renderQuizStep(w);
    } else {
      renderGapStep(w);
    }
  }

  function nextStep() { idx++; showingAnswer = false; draw(); }

  function renderFlashStep(w) {
    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      categoryTag(w.cat) +
      '<div class="flashcard">' + (showingAnswer ? w.pl : w.en) + '</div>' +
      '<p class="context-sentence">' + (showingAnswer ? w.sentence_en : "") + '</p>';
    app.appendChild(card);
    if (!showingAnswer) {
      var btn = document.createElement("button");
      btn.className = "action";
      btn.textContent = "Pokaz odpowiedz";
      btn.onclick = function() { showingAnswer = true; draw(); };
      app.appendChild(btn);
    } else {
      var btnGood = document.createElement("button");
      btnGood.className = "action correct";
      btnGood.textContent = "Wiedzialem";
      btnGood.onclick = function() { reviewWord(w.id, true); correctCount++; nextStep(); };
      var btnBad = document.createElement("button");
      btnBad.className = "action wrong";
      btnBad.textContent = "Nie wiedzialem";
      btnBad.onclick = function() { reviewWord(w.id, false); wrongCount++; nextStep(); };
      app.appendChild(btnGood);
      app.appendChild(btnBad);
    }
  }

  function renderQuizStep(w) {
    var askEn = Math.random() > 0.5;
    var question = askEn ? w.en : w.pl;
    var correctAnswer = askEn ? w.pl : w.en;
    var pool2 = shuffle(getAllWords().filter(function(x){ return x.id !== w.id; })).slice(0, 3);
    var options = shuffle([correctAnswer].concat(pool2.map(function(p){ return askEn ? p.pl : p.en; })));

    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML = categoryTag(w.cat) + "<h3>" + question + "</h3>";
    app.appendChild(card);

    var optsCard = document.createElement("div");
    optsCard.className = "card";
    var answered = false;
    options.forEach(function(opt) {
      var b = document.createElement("button");
      b.className = "quiz-option";
      b.textContent = opt;
      b.onclick = function() {
        if (answered) return;
        answered = true;
        var isCorrect = opt === correctAnswer;
        if (isCorrect) { correctCount++; } else { wrongCount++; }
        b.classList.add(isCorrect ? "correct" : "wrong");
        
        if (!isCorrect) {
          Array.prototype.forEach.call(optsCard.children, function(c) {
            if (c.textContent === correctAnswer) c.classList.add("correct");
          });
        }

        reviewWord(w.id, isCorrect);
        var nextBtn = document.createElement("button");
        nextBtn.className = "action";
        nextBtn.textContent = "Dalej";
        nextBtn.onclick = nextStep;
        app.appendChild(nextBtn);
      };
      optsCard.appendChild(b);
    });
    app.appendChild(optsCard);
  }

  function renderGapStep(w) {
    var mainWord = w.en.split(" / ")[0].replace("To ", "").split(" (")[0];
    var regex = new RegExp(mainWord, "i");
    var gapped = w.sentence_en.replace(regex, "_____");

    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      categoryTag(w.cat) +
      '<p class="translation-hint">Tlumaczenie: ' + w.pl + '</p>' +
      '<p class="gap-sentence">' + gapped + '</p>' +
      '<input type="text" id="dailyGapInput" placeholder="Wpisz brakujace slowo">' +
      '<button class="action" id="dailyCheckGap">Sprawdz</button>' +
      '<div id="dailyGapFeedback"></div>';
    app.appendChild(card);



document.getElementById("dailyCheckGap").onclick = function() {
 var val = document.getElementById("dailyGapInput").value.trim().toLowerCase();
 var isCorrect = val.length > 0 && val === mainWord.toLowerCase();


      if (isCorrect) { correctCount++; } else { wrongCount++; }
      reviewWord(w.id, isCorrect);
      document.getElementById("dailyCheckGap").disabled = true;
      document.getElementById("dailyGapInput").disabled = true;
      var fb = document.getElementById("dailyGapFeedback");
      fb.className = "feedback " + (isCorrect ? "ok" : "bad");
      fb.textContent = isCorrect ? "Dobrze!" : ("Poprawna odpowiedz: " + mainWord);
      var nextBtn = document.createElement("button");
      nextBtn.className = "action";
      nextBtn.textContent = "Dalej";
      nextBtn.onclick = nextStep;
      app.appendChild(nextBtn);
    };
  }

  draw();

function startChallenge() {
  var pool = getAllWords();

  var wrongCount = 0;

  var currentWord = null;
  var currentCorrectAnswer = null;

  function pickNewQuestion() {
    var w = pool[Math.floor(Math.random() * pool.length)];
    var askEn = Math.random() > 0.5;
    currentWord = w;
    currentCorrectAnswer = askEn ? w.pl : w.en;
    var question = askEn ? w.en : w.pl;
    var otherPool = shuffle(pool.filter(function(x){ return x.id !== w.id; })).slice(0, 3);
    var options = shuffle([currentCorrectAnswer].concat(otherPool.map(function(p){ return askEn ? p.pl : p.en; })));
    return { question: question, options: options };
  }

  function drawQuestion() {
    var q = pickNewQuestion();
    var qCard = document.getElementById("challengeQuestionArea");
    qCard.innerHTML = "<h3>" + q.question + "</h3>";
    var optsArea = document.getElementById("challengeOptionsArea");
    optsArea.innerHTML = "";
    q.options.forEach(function(opt) {
      var b = document.createElement("button");
      b.className = "quiz-option";
      b.textContent = opt;
      
  b.onclick = function() {
    var isCorrect = opt === currentCorrectAnswer;
    b.classList.add(isCorrect ? "correct" : "wrong");

    reviewWord(currentWord.id, isCorrect);
    document.getElementById("challengeScoreArea").textContent = "Poprawne: " + correctCount + " | Bledne: " + wrongCount;
    if (!isCorrect) {
      Array.prototype.forEach.call(optsArea.children, function(c) {
        if (c.textContent === currentCorrectAnswer) c.classList.add("correct");
      });
    }
    Array.prototype.forEach.call(optsArea.children, function(c) { c.disabled = true; });
    setTimeout(drawQuestion, isCorrect ? 300 : 900);
  };

      optsArea.appendChild(b);
    });
  }

  function endChallenge() {
    clearInterval(timerInterval);
    app.innerHTML = "";
    app.appendChild(backButton());
    var done = document.createElement("div");
    done.className = "card";
    done.innerHTML = "<h3>Koniec wyzwania</h3><p>Poprawne odpowiedzi: " + correctCount + "</p><p>Bledne odpowiedzi: " + wrongCount + "</p>";
    app.appendChild(done);
    var retryBtn = document.createElement("button");
    retryBtn.className = "action";
    retryBtn.textContent = "Sprobuj ponownie";
    retryBtn.onclick = startChallenge;
    app.appendChild(retryBtn);
  }

  app.innerHTML = "";
  app.appendChild(backButton());

  var introCard = document.createElement("div");
  introCard.className = "card";
  introCard.innerHTML = "<h3>Wyzwanie 60 sekund</h3><p class='translation-hint'>Odpowiedz poprawnie na jak najwiecej pytan w 60 sekund.</p><button class='action' id='startChallengeBtn'>Start</button>";
  app.appendChild(introCard);

  document.getElementById("startChallengeBtn").onclick = function() {
    app.innerHTML = "";
    app.appendChild(backButton());

    var timerCard = document.createElement("div");
    timerCard.className = "card score-card";
    timerCard.innerHTML = '<div class="stats"><span id="challengeTimer">Czas: 60s</span><span id="challengeScoreArea">Poprawne: 0 | Bledne: 0</span></div>';
    app.appendChild(timerCard);

    var qCard = document.createElement("div");
    qCard.className = "card";
    qCard.id = "challengeQuestionArea";
    app.appendChild(qCard);

    var optsCard = document.createElement("div");
    optsCard.className = "card";
    optsCard.id = "challengeOptionsArea";
    app.appendChild(optsCard);

    drawQuestion();

    timerInterval = setInterval(function() {
      timeLeft--;
      document.getElementById("challengeTimer").textContent = "Czas: " + timeLeft + "s";
      if (timeLeft <= 0) { endChallenge(); }

    app.innerHTML = "";

      var empty = document.createElement("div");
      empty.className = "card";

      app.appendChild(empty);
      return;

      done.className = "card";
      done.innerHTML = "<p>Skonczyles te sesje fiszek. Wroc do menu lub zacznij ponownie.</p>";

      return;
    }
    var w = queue[idx];
    var card = document.createElement("div");
    card.className = "card";
    var front = direction === "en" ? w.en : w.pl;
    var back = direction === "en" ? w.pl : w.en;
    card.innerHTML =
      categoryTag(w.cat) +
      '<div class="flashcard">' + (showingAnswer ? back : front) + '</div>' +

      btn.className = "action";
      btn.textContent = "Pokaz odpowiedz";
      btn.onclick = function() { showingAnswer = true; draw(); };
      app.appendChild(btn);
    } else {
      var btnGood = document.createElement("button");
      btnGood.className = "action correct";
      btnGood.textContent = "Wiedzialem";
      btnGood.onclick = function() { reviewWord(w.id, true); showingAnswer = false; idx++; draw(); };

      var btnBad = document.createElement("button");
      btnBad.className = "action wrong";
      btnBad.textContent = "Nie wiedzialem";
      btnBad.onclick = function() { reviewWord(w.id, false); showingAnswer = false; idx++; draw(); };

function startSentenceBuilder() {
  var queue = shuffle(dueWords().length ? dueWords() : getAllWords()).slice(0, 10);
  var idx = 0;
  var correctCount = 0;
  var wrongCount = 0;

  function draw() {
    app.innerHTML = "";
    app.appendChild(backButton());
    if (idx >= queue.length) {
      var done = document.createElement("div");
      done.className = "card";
      done.innerHTML = "<p>Koniec cwiczenia. Wynik: " + correctCount + " poprawnych, " + wrongCount + " blednych.</p>";
      app.appendChild(done);
      return;
    }
    var w = queue[idx];
    var words = w.sentence_en.replace(/[.,!?]/g, "").split(" ");
    var shuffled = shuffle(words);
    var built = [];

    var scoreCard = document.createElement("div");
    scoreCard.className = "card score-card";
    scoreCard.innerHTML = '<div class="stats"><span>Zdanie ' + (idx+1) + ' / ' + queue.length + '</span><span>Poprawne: ' + correctCount + ' | Bledne: ' + wrongCount + '</span></div>';
    app.appendChild(scoreCard);

    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      categoryTag(w.cat) +
      '<p class="translation-hint">Uloz zdanie zawierajace: <b>' + w.en + '</b> (' + w.pl + ')</p>' +
      '<div class="sentence-slot" id="builtSentence"></div>' +
      '<div id="chipsArea"></div>' +
      '<button class="action ghost" id="resetBtn">Wyczysc</button>' +
      '<button class="action" id="checkSentence">Sprawdz</button>' +
      '<div id="sentFeedback"></div>';
    app.appendChild(card);

    var chipsArea = document.getElementById("chipsArea");
    var builtDiv = document.getElementById("builtSentence");

    function renderChips() {
      chipsArea.innerHTML = "";
      shuffled.forEach(function(word, i) {
        var chip = document.createElement("span");
        chip.className = "word-chip" + (built.indexOf(i) !== -1 ? " used" : "");
        chip.textContent = word;
        chip.onclick = function() {
          if (built.indexOf(i) !== -1) return;
          built.push(i);
          builtDiv.textContent = built.map(function(bi){ return shuffled[bi]; }).join(" ");
          renderChips();
        };
        chipsArea.appendChild(chip);
      });
    }
    renderChips();

    document.getElementById("resetBtn").onclick = function() {
      built = [];
      builtDiv.textContent = "";
      renderChips();
    };

    document.getElementById("checkSentence").onclick = function() {
      var result = built.map(function(bi){ return shuffled[bi]; }).join(" ").toLowerCase();
      var target = words.join(" ").toLowerCase();
      var isCorrect = result === target;
      if (isCorrect) { correctCount++; } else { wrongCount++; }
      reviewWord(w.id, isCorrect);
      document.getElementById("checkSentence").disabled = true;
      document.getElementById("resetBtn").disabled = true;
      var fb = document.getElementById("sentFeedback");
      fb.className = "feedback " + (isCorrect ? "ok" : "bad");
      fb.textContent = isCorrect ? "Swietnie, dobra kolejnosc!" : ("Poprawne zdanie: " + w.sentence_en);
      var nextBtn = document.createElement("button");
      nextBtn.className = "action";
      nextBtn.textContent = "Dalej";
      nextBtn.onclick = function() { idx++; draw(); };
      app.appendChild(nextBtn);
    };
  }
  draw();
}

    '<textarea id="newSentPl" placeholder="Tlumaczenie tego zdania po polsku"></textarea><br><br>' +
    '<button class="action" id="saveWordBtn">Zapisz slowo</button>' +
    '<div id="addFeedback"></div>';
  app.appendChild(card);

  document.getElementById("saveWordBtn").onclick = function() {
    var en = document.getElementById("newEn").value.trim();
    var pl = document.getElementById("newPl").value.trim();
    var cat = document.getElementById("newCat").value.trim() || "Custom";
    var sentence_en = document.getElementById("newSentEn").value.trim();
    var sentence_pl = document.getElementById("newSentPl").value.trim();

    if (!en || !pl || !sentence_en || !sentence_pl) {
      document.getElementById("addFeedback").innerHTML = "<p class='feedback bad'>Uzupelnij wszystkie pola.</p>";
      return;
    }
    var customWords = loadCustomWords();
    var newId = 1000 + customWords.length;
   
 customWords.push({ id: newId, en: en, pl: pl, cat: cat, sentence_en: sentence_en, sentence_pl: sentence_pl });
 saveCustomWords(customWords);
 if (window.syncProgressToCloud) { window.syncProgressToCloud(progress, customWords); }

    document.getElementById("addFeedback").innerHTML = "<p class='feedback ok'>Dodano! Slowo pojawi sie teraz we wszystkich trybach nauki.</p>";
    document.getElementById("newEn").value = "";
    document.getElementById("newPl").value = "";
    document.getElementById("newCat").value = "";
    document.getElementById("newSentEn").value = "";
    document.getElementById("newSentPl").value = "";
  };
}

function renderGrammarCheck() {
  app.innerHTML = "";
  app.appendChild(backButton());
  var card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<h3>Sprawdz swoje zdanie</h3>' +
    '<p class="translation-hint">Wpisz zdanie po angielsku, a nastepnie kliknij przycisk. Otworzy sie strona LanguageTool z Twoim zdaniem gotowym do sprawdzenia.</p>' +
    '<textarea id="checkInput" placeholder="Np. She have finished the report yesterday."></textarea><br><br>' +
    '<button class="action" id="checkGrammarBtn">Otworz sprawdzanie w LanguageTool</button>';
  app.appendChild(card);

  document.getElementById("checkGrammarBtn").onclick = function() {
    var text = document.getElementById("checkInput").value.trim();
    if (!text) return;
    var url = "https://languagetool.org/?text=" + encodeURIComponent(text) + "&language=en-US";
    window.open(url, "_blank");
  };
}

function renderBackup() {
  app.innerHTML = "";
  app.appendChild(backButton());
  var card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<h3>Kopia zapasowa postepu</h3>' +
    '<p class="translation-hint">Pobierz plik z Twoim postepem, aby przeniesc go na inne urzadzenie lub zabezpieczyc przed utrata danych.</p>' +
    '<button class="action" id="exportBtn">Pobierz moj postep</button>' +
    '<hr class="divider">' +
    '<p class="translation-hint">Wczytaj wczesniej pobrany plik, aby przywrocic postep na tym urzadzeniu.</p>' +
    '<input type="file" id="importFile" accept=".json">' +
    '<button class="action" id="importBtn">Wczytaj postep</button>' +
    '<div id="backupFeedback"></div>';
  app.appendChild(card);

  document.getElementById("exportBtn").onclick = exportProgress;

  document.getElementById("importBtn").onclick = function() {
    var fileInput = document.getElementById("importFile");
    var fb = document.getElementById("backupFeedback");
    if (!fileInput.files || !fileInput.files[0]) {
      fb.innerHTML = "<p class='feedback bad'>Wybierz najpierw plik.</p>";
      return;
    }
    importProgress(fileInput.files[0], function(success) {
      if (success) {
        fb.innerHTML = "<p class='feedback ok'>Postep zostal wczytany! Wroc do menu, aby zobaczyc zmiany.</p>";
      } else {
        fb.innerHTML = "<p class='feedback bad'>Nie udalo sie odczytac pliku.</p>";
      }
    });
  };
}

function renderWeakSpots() {
  app.innerHTML = "";
  app.appendChild(backButton());
  var weak = hardWords();

  var headerCard = document.createElement("div");
  headerCard.className = "card";
  headerCard.innerHTML = '<h3>Twoje slabe punkty</h3><p class="translation-hint">Slowka, w ktorych popelniles co najmniej jeden blad. Znaleziono: ' + weak.length + '</p>';
  app.appendChild(headerCard);

  if (weak.length === 0) {
    var okCard = document.createElement("div");
    okCard.className = "card";
    okCard.innerHTML = "<p>Nie masz jeszcze zadnych slabych punktow.</p>";
    app.appendChild(okCard);
    return;
  }

  var trainBtn = document.createElement("button");
  trainBtn.className = "action";
  trainBtn.textContent = "Cwicz tylko te slowka (fiszki)";
  trainBtn.style.marginBottom = "12px";
  trainBtn.onclick = function() { startFlashcards("en", true); };
  app.appendChild(trainBtn);

  var top10 = weak.slice(0, 10);
  var rest = weak.slice(10);

  var topCard = document.createElement("div");
  topCard.className = "card";
  topCard.innerHTML = '<h4 class="section-title">Top 10 najtrudniejszych</h4>';
  top10.forEach(function(w, i) {
    var s = getWordState(w.id);
    var row = document.createElement("div");
    row.className = "weak-row";
    row.innerHTML = '<b>' + (i+1) + '. ' + w.en + '</b> - ' + w.pl + ' <span class="error-count">(bledy: ' + (s.seen - s.correct) + ')</span>' + categoryTag(w.cat);
    topCard.appendChild(row);
  });
  app.appendChild(topCard);

  if (rest.length > 0) {
    var restCard = document.createElement("div");
    restCard.className = "card";
    restCard.innerHTML = '<h4 class="section-title">Pozostale slowka do poprawy</h4>';
    rest.forEach(function(w) {
      var s = getWordState(w.id);
      var row = document.createElement("div");
      row.className = "weak-row";
      row.innerHTML = '<b>' + w.en + '</b> - ' + w.pl + ' <span class="error-count">(bledy: ' + (s.seen - s.correct) + ')</span>';
      restCard.appendChild(row);
    });
    app.appendChild(restCard);
  }
}

function renderStats() {
  app.innerHTML = "";
  app.appendChild(backButton());
  var week = getWeekStats();
  var totalCorrect = week.reduce(function(sum, d){ return sum + d.correct; }, 0);
  var totalWrong = week.reduce(function(sum, d){ return sum + d.wrong; }, 0);

  var card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<h3>Statystyki z ostatnich 7 dni</h3><p class="translation-hint">Poprawne: ' + totalCorrect + ' | Bledne: ' + totalWrong + '</p>';
  app.appendChild(card);

  var chartCard = document.createElement("div");
  chartCard.className = "card";
  var maxVal = Math.max(1, Math.max.apply(null, week.map(function(d){ return d.correct + d.wrong; })));
  week.forEach(function(d) {
    var total = d.correct + d.wrong;
    var pctCorrect = total > 0 ? (d.correct / maxVal * 100) : 0;
    var pctWrong = total > 0 ? (d.wrong / maxVal * 100) : 0;
    var dayLabel = d.date.slice(5);
    var row = document.createElement("div");
    row.className = "stat-row";
    row.innerHTML =
      '<div class="stat-row-label">' + dayLabel + ' (' + total + ' odpowiedzi)</div>' +
      '<div class="stat-bar-bg">' +
        '<div class="stat-bar-fill correct-fill" style="width:' + pctCorrect + '%"></div>' +
        '<div class="stat-bar-fill wrong-fill" style="width:' + pctWrong + '%"></div>' +
      '</div>';
    chartCard.appendChild(row);
  });
  app.appendChild(chartCard);
}



window.onAuthReady = function(user) {
 renderHeaderAuthButton();
 render(renderMenu);
};

if (window.currentUser !== undefined) {
 render(renderMenu);
} else {
 render(renderMenu);
}
</script>
